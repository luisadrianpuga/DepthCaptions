[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depthcaptions"
version = "0.1.0"
description = "Add word-by-word captions that appear behind the person in a video"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai-whisper",
    "opencv-python",
    "mediapipe",
    "Pillow",
    "numpy<2",
    "mcp[cli]",
]

[project.scripts]
depthcaptions = "depthcaptions.__main__:main"

[tool.setuptools.packages.find]
include = ["depthcaptions*"]
